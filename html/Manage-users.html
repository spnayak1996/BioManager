<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Users</title>
  <link rel="stylesheet" href="../css/Manage-users_style.css" />
</head>
<body>
  <header class="page-header">
    <div class="page-headings">
      <h1 id="page-title">Manage Users</h1>
      <p id="page-subtitle">Manage user accounts and permissions</p>
    </div>
    <button id="export-csv" class="btn-export" type="button">+ Add User</button>
  </header>

  <section id="page-content"></section>

  <!-- Stats wrapper -->
  <template id="stats-wrapper-template">
    <div class="stats-wrapper" id="stats-root">
      <div class="stats"></div>
    </div>
  </template>

  <!-- Stat tile -->
  <template id="stats-tile-template">
    <div class="stat user-stat">
      <div class="stat-head">
        <span class="stat-ico-box"><img class="stat-icon" alt="" /></span>
        <span class="stat-label-text"></span>
      </div>
      <div class="stat-value"></div>
    </div>
  </template>

  <!-- Users list -->
  <template id="users-list-template">
    <div class="card users-card">
      <div class="table-header">
        <h2 class="table-title">Users (<span id="users-count"></span>)</h2>
      </div>

      <div class="users-head users-grid">
        <span>User</span>
        <span>Role</span>
        <span>Status</span>
        <span>Created</span>
        <span>Actions</span>
      </div>

      <div class="users-list js-users-list"></div>
    </div>
  </template>

  <!-- Single user row -->
  <template id="user-item-template">
    <div class="users-row users-grid js-user-row">
      <div class="users-col">
        <span class="js-name"></span><br />
        <small class="js-email"></small>
      </div>
      <div class="users-col js-role"></div>
      <div class="users-col">
        <span class="status">
          <img class="status-icon" alt="" />
          <span class="js-status-text"></span>
        </span>
      </div>
      <div class="users-col js-created"></div>
      <div class="users-col">
        <div class="actions">
          <button class="btn btn-edit">
            <img src="../icons/file-pen-line.svg" alt="" class="btn-ico" />
            Edit
          </button>
          <button class="btn btn-toggle">
            <span class="btn-label"></span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- Add/Edit User Modal -->
  <template id="user-modal-template">
  <div class="modal-backdrop" data-modal>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="user-modal-title">
      <div class="modal-header">
        <h2 class="modal-title" id="user-modal-title">Add User</h2>
        <button class="modal-close" type="button" aria-label="Close">&times;</button>
      </div>

      <form id="user-form" novalidate>
        <div class="form-grid">
          <div class="form-field">
            <label for="f-userName">Full name</label>
            <input id="f-userName" name="userName" type="text" required />
            <small class="field-error" data-err-userName></small>
          </div>

          <div class="form-field">
            <label for="f-email">Email</label>
            <input id="f-email" name="email" type="email" required />
            <small class="field-error" data-err-email></small>
          </div>

          <div class="form-field">
            <label for="f-role">Role</label>
            <select id="f-role" name="role" required>
              <option value="">Select…</option>
              <option value="admin">Admin</option>
              <option value="user">User</option>
            </select>
            <small class="field-error" data-err-role></small>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary js-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save User</button>
        </div>
      </form>
    </div>
  </div>
</template>

  <script type="module" src="../scripts/Manage-users_script.js"></script>
</body>
</html>
