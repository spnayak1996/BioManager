<!-- pages/Manage-users.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Users</title>
  <link rel="stylesheet" href="../css/Manage-users_style.css" />
</head>
<body>
  <header class="page-header">
    <div class="page-headings">
      <h1 id="page-title">Manage Users</h1>
      <p id="page-subtitle">Manage user accounts and permissions</p>
    </div>
    <button id="export-csv" class="btn-export" type="button">+ Add User</button>
  </header>

  <section id="page-content"></section>

  <!-- Stats wrapper -->
  <template id="stats-wrapper-template">
    <div class="stats-wrapper" id="stats-root">
      <div class="stats"></div>
    </div>
  </template>

  <!-- Screenshot-style stat tile -->
  <template id="stats-tile-template">
    <div class="stat user-stat">
      <div class="stat-head">
        <span class="stat-ico-box">
          <img class="stat-icon" alt="" />
        </span>
        <span class="stat-label-text"></span>
      </div>
      <div class="stat-value"></div>
    </div>
  </template>

  <!-- Search -->
  <template id="search-card-template">
    <div class="card" id="search">
      <div class="search-row">
        <div class="search-input-wrap">
          <img src="../icons/search.svg" class="search-ico" alt="" />
          <input id="user-search" class="js-user-search" type="text" placeholder="Search users..." />
        </div>

        <div class="select-wrap">
          <select id="user-status" class="js-user-status" aria-label="Filter by status">
            <option value="all">All Status</option>
            <option value="active">Active</option>
            <option value="compliance">Compliance</option>
            <option value="inactive">Inactive</option>
          </select>
          <img src="../icons/chevron-down.svg" class="select-caret" alt="" />
        </div>
      </div>
    </div>
  </template>

  <!-- Users list (div-based grid) -->
  <template id="users-list-template">
    <div class="card users-card">
      <div class="table-header">
        <h2 class="table-title">Users (<span id="users-count"></span>)</h2>
      </div>

      <div class="users-head users-grid">
        <span>User</span>
        <span>Role</span>
        <span>Status</span>
        <span>Created</span>
        <span>Actions</span>
      </div>

      <div class="users-list js-users-list"></div>
    </div>
  </template>

  <!-- Single user row -->
  <template id="user-item-template">
    <div class="users-row users-grid js-user-row">
      <div class="users-col">
        <span class="js-name"></span><br />
        <small class="js-email"></small>
      </div>
      <div class="users-col js-role"></div>
      <div class="users-col">
        <span class="status">
          <img class="status-icon" alt="" />
          <span class="js-status-text"></span>
        </span>
      </div>
      <div class="users-col js-created"></div>
      <div class="users-col">
        <button class="view-btn">
          <img src="../icons/eye.svg" alt="View" class="view-icon" />
          View
        </button>
      </div>
    </div>
  </template>

  <script type="module" src="../scripts/Manage-users_script.js"></script>
</body>
</html>
