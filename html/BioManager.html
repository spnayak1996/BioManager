<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioManager</title>
  <link rel="stylesheet" href="../css/BioManager_style.css" />
  <style>
    .content-frame { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <img src="../icons/file-text.svg" alt="" />
      </div>
      <div class="brand-texts">
        <div class="brand-title">BioManager</div>
        <div class="brand-subtitle">Marketing Bio Portal</div>
      </div>
    </div>

    <div class="sidebar-sep"></div>

    <h3 class="nav-label">NAVIGATION</h3>
    <nav class="nav" id="left-nav">
      <!-- NOTE: href keeps the original hash, data-src points to the right-panel page -->
      <a href="#dashboard"         class="nav-link" data-src="./Coming-soon.html">
        <span class="nav-ico"><img src="../icons/dashboard.svg" alt="" /></span>
        <span class="nav-text">Dashboard</span>
      </a>

      <a href="#manage-users"      class="nav-link" data-src="./Manage-users.html">
        <span class="nav-ico"><img src="../icons/users.svg" alt="" /></span>
        <span class="nav-text">Manage Users</span>
      </a>

      <a href="#approved-domains"  class="nav-link" data-src="./Coming-soon.html">
        <span class="nav-ico"><img src="../icons/building.svg" alt="" /></span>
        <span class="nav-text">Approved Domains</span>
      </a>

      <a href="#all-bios"          class="nav-link" data-src="./bios.html" data-default>
        <span class="nav-ico"><img src="../icons/file-text.svg" alt="" /></span>
        <span class="nav-text">All Bios</span>
      </a>
    </nav>

    <div class="user-info">
      <div class="user-left">
        <div class="user-avatar">S</div>
        <div class="user-meta">
          <div class="user-name">satish</div>
          <div class="user-role">Admin</div>
        </div>
      </div>
      <button class="user-logout" id="user-logout">
        <img src="../icons/logout.svg" alt="Logout" />
      </button>
    </div>
  </aside>

  <main class="main-content">
    <!-- No hardcoded src; JS sets it based on hash / active link -->
    <iframe id="content-frame" class="content-frame" title="BioManager Content"></iframe>
  </main>

  <script type="module" src="../scripts/BioManager_script.js">
  </script>
</body>
</html>
